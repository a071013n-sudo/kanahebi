<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カナヘビ観察日記</title>
<meta name="theme-color" content="#16211A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#16211A;
    --bg-panel:#1F2E23;
    --bg-panel-2:#243528;
    --line: rgba(237,232,216,0.14);
    --moss:#7FA66B;
    --moss-dim:#5C7E4E;
    --amber:#D9A441;
    --alert:#C1543A;
    --text:#EDE8D8;
    --text-dim:#B7B29E;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 18px;}

  header{
    padding:28px 18px 18px;
    text-align:center;
    position:relative;
  }
  header .badge-emoji{font-size:34px;display:block;margin-bottom:2px;}
  h1{
    font-family:'Kaisei Decol',serif;
    font-size:26px;
    font-weight:400;
    letter-spacing:.04em;
    margin:0;
  }
  header p{
    color:var(--text-dim);
    font-size:13px;
    margin:6px 0 0;
  }

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }

  /* --- 撮影エリア --- */
  .capture{
    text-align:center;
  }
  .photo-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--bg-panel-2);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px dashed var(--line);
    margin-bottom:14px;
  }
  .photo-frame img{
    width:100%;height:100%;object-fit:cover;
  }
  .photo-frame .placeholder{
    color:var(--text-dim);
    font-size:13px;
    text-align:center;
    padding:20px;
  }
  .photo-frame .tape{
    position:absolute;top:-8px;left:50%;
    transform:translateX(-50%) rotate(-2deg);
    width:70px;height:22px;
    background:rgba(217,164,65,0.35);
    border:1px solid rgba(217,164,65,0.5);
  }

  input[type=file]{display:none;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:14px 18px;
    border-radius:999px;
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--moss);color:#0F1A12;}
  .btn-secondary{
    background:transparent;color:var(--text);
    border:1px solid var(--line);
    margin-top:10px;
  }
  .btn:disabled{opacity:.5;cursor:default;}

  /* --- ローディング --- */
  .loading{
    display:flex;align-items:center;gap:10px;
    color:var(--text-dim);font-size:13px;
    justify-content:center;padding:8px 0;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--moss);animation:blink 1.2s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

  /* --- 結果 --- */
  .result-head{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .stamp{
    flex-shrink:0;
    width:64px;height:64px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    text-align:center;line-height:1.2;
    border:2.5px solid currentColor;
    transform:rotate(-8deg);
    letter-spacing:.02em;
  }
  .stamp.ok{color:var(--moss);}
  .stamp.warn{color:var(--amber);}
  .stamp.alert{color:var(--alert);}

  .overall{font-size:14.5px;line-height:1.7;color:var(--text);}

  .findings{list-style:none;margin:16px 0 0;padding:0;}
  .findings li{
    padding:12px 0;
    border-top:1px solid var(--line);
    display:flex;gap:10px;
  }
  .findings li:first-child{border-top:none;}
  .f-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .f-dot.良好{background:var(--moss);}
  .f-dot.注意{background:var(--amber);}
  .f-dot.判断不可{background:var(--text-dim);}
  .f-body .f-item{font-size:13px;font-weight:700;color:var(--text-dim);}
  .f-body .f-detail{font-size:14px;margin-top:2px;}

  .advice-title, .section-title{
    font-family:'Kaisei Decol',serif;
    font-size:15px;
    margin:20px 0 8px;
    color:var(--amber);
  }
  .advice-list{margin:0;padding-left:20px;font-size:14px;line-height:1.8;}
  .advice-list li{margin-bottom:4px;}

  .vet-banner{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:rgba(193,84,58,0.14);
    border:1px solid rgba(193,84,58,0.4);
    font-size:13.5px;
    line-height:1.6;
  }
  .vet-banner b{color:var(--alert);}

  .disclaimer{
    margin-top:16px;
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:10px;
  }

  .error-box{
    background:rgba(193,84,58,0.12);
    border:1px solid rgba(193,84,58,0.4);
    border-radius:12px;
    padding:14px;
    font-size:13.5px;
    line-height:1.6;
  }

  /* --- 設定 --- */
  details.settings summary{
    cursor:pointer;font-size:13px;color:var(--text-dim);
    list-style:none;
  }
  details.settings summary::-webkit-details-marker{display:none;}
  details.settings[open] summary{margin-bottom:10px;}
  .settings input[type=text]{
    width:100%;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg-panel-2);
    color:var(--text);font-size:13px;margin-bottom:8px;
    font-family:inherit;
  }
  .settings .hint{font-size:11.5px;color:var(--text-dim);line-height:1.6;}

  /* --- 履歴 --- */
  .history-item{
    display:flex;gap:12px;align-items:center;
    padding:10px 0;border-top:1px solid var(--line);
  }
  .history-item:first-child{border-top:none;}
  .history-item img{
    width:52px;height:52px;object-fit:cover;border-radius:10px;flex-shrink:0;
  }
  .history-meta{flex:1;min-width:0;}
  .history-date{font-size:11.5px;color:var(--text-dim);}
  .history-summary{font-size:13px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    flex-shrink:0;
  }
  .history-badge.ok{background:rgba(127,166,107,0.2);color:var(--moss);}
  .history-badge.warn{background:rgba(217,164,65,0.2);color:var(--amber);}
  .history-badge.alert{background:rgba(193,84,58,0.2);color:var(--alert);}
  .empty-history{color:var(--text-dim);font-size:13px;text-align:center;padding:12px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge-emoji">🦎</span>
    <h1>カナヘビ観察日記</h1>
    <p>写真を撮って、気になる兆候をチェック</p>
  </header>

  <div class="card capture">
    <div class="photo-frame" id="photoFrame">
      <div class="tape"></div>
      <div class="placeholder" id="photoPlaceholder">ここに写真が表示されます<br>体全体がわかるように撮ってみてください</div>
      <img id="photoPreview" style="display:none;">
    </div>

    <label class="btn btn-primary" for="fileInput">📷 写真を撮る / 選ぶ</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <button class="btn btn-primary" id="analyzeBtn" style="display:none;margin-top:10px;">この写真をチェックする</button>

    <div class="loading" id="loading" style="display:none;">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>観察中…</span>
    </div>

    <details class="settings" style="margin-top:14px;text-align:left;">
      <summary>⚙ 接続設定</summary>
      <input type="text" id="gasUrl" placeholder="GAS WebアプリのURL(.../exec)">
      <button class="btn btn-secondary" id="saveSettingsBtn" style="margin-top:0;">保存</button>
      <p class="hint">Google Apps Scriptで発行したWebアプリのURLを入力してください。画像はこのURL経由でClaude APIに送られます。</p>
    </details>
  </div>

  <div class="card" id="resultCard" style="display:none;"></div>

  <div class="card">
    <div class="section-title" style="margin-top:0;">観察履歴</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const STORAGE_URL_KEY = 'kanahebi_gas_url';
const STORAGE_HISTORY_KEY = 'kanahebi_history';
const MAX_HISTORY = 30;

const fileInput = document.getElementById('fileInput');
const photoFrame = document.getElementById('photoFrame');
const photoPreview = document.getElementById('photoPreview');
const photoPlaceholder = document.getElementById('photoPlaceholder');
const analyzeBtn = document.getElementById('analyzeBtn');
const loading = document.getElementById('loading');
const resultCard = document.getElementById('resultCard');
const gasUrlInput = document.getElementById('gasUrl');
const saveSettingsBtn = document.getElementById('saveSettingsBtn');
const historyList = document.getElementById('historyList');

let currentImageBase64 = null;
let currentImageMime = 'image/jpeg';
let currentThumb = null;

// --- 設定の読み書き ---
gasUrlInput.value = localStorage.getItem(STORAGE_URL_KEY) || '';
saveSettingsBtn.addEventListener('click', () => {
  localStorage.setItem(STORAGE_URL_KEY, gasUrlInput.value.trim());
  saveSettingsBtn.textContent = '保存しました ✓';
  setTimeout(() => saveSettingsBtn.textContent = '保存', 1500);
});

// --- 写真選択 → リサイズ・プレビュー ---
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1024;
      let { width, height } = img;
      if (width > height && width > maxDim) {
        height = Math.round(height * maxDim / width); width = maxDim;
      } else if (height > maxDim) {
        width = Math.round(width * maxDim / height); height = maxDim;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.78);

      currentImageBase64 = dataUrl.split(',')[1];
      currentImageMime = 'image/jpeg';

      const thumbCanvas = document.createElement('canvas');
      thumbCanvas.width = 120; thumbCanvas.height = 120;
      const tctx = thumbCanvas.getContext('2d');
      const side = Math.min(width, height);
      tctx.drawImage(img, (width-side)/2 * (img.width/width), (height-side)/2 * (img.height/height),
        side * (img.width/width), side*(img.height/height), 0, 0, 120, 120);
      currentThumb = thumbCanvas.toDataURL('image/jpeg', 0.7);

      photoPreview.src = dataUrl;
      photoPreview.style.display = 'block';
      photoPlaceholder.style.display = 'none';
      analyzeBtn.style.display = 'block';
      resultCard.style.display = 'none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// --- 解析リクエスト ---
analyzeBtn.addEventListener('click', async () => {
  const gasUrl = localStorage.getItem(STORAGE_URL_KEY);
  if (!gasUrl) {
    alert('先に「接続設定」でGAS WebアプリのURLを保存してください。');
    return;
  }
  if (!currentImageBase64) return;

  analyzeBtn.disabled = true;
  loading.style.display = 'flex';
  resultCard.style.display = 'none';

  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ image: currentImageBase64, mimeType: currentImageMime })
    });
    const data = await res.json();
    renderResult(data);
    if (!data.error) saveHistory(data);
  } catch (err) {
    renderError('通信エラーが発生しました。接続設定のURLや通信環境を確認してください。(' + err.message + ')');
  } finally {
    loading.style.display = 'none';
    analyzeBtn.disabled = false;
  }
});

function statusClass(vetRecommended, findings) {
  if (vetRecommended) return 'alert';
  const hasWarn = (findings || []).some(f => f.status === '注意');
  return hasWarn ? 'warn' : 'ok';
}

function renderError(msg) {
  resultCard.style.display = 'block';
  resultCard.innerHTML = `<div class="error-box">⚠ ${escapeHtml(msg)}</div>`;
}

function renderResult(data) {
  if (data.error) {
    renderError(data.error + (data.detail ? '\n' + data.detail : ''));
    return;
  }
  const cls = statusClass(data.vet_recommended, data.findings);
  const stampLabel = cls === 'alert' ? '要受診\n相談' : (cls === 'warn' ? '経過\n観察' : '概ね\n良好');

  let html = `
    <div class="result-head">
      <div class="stamp ${cls}">${stampLabel.replace('\n','<br>')}</div>
      <div class="overall">${escapeHtml(data.overall_impression || '')}</div>
    </div>
  `;

  if (data.findings && data.findings.length) {
    html += '<div class="section-title">気になった点</div><ul class="findings">';
    data.findings.forEach(f => {
      html += `<li><span class="f-dot ${escapeAttr(f.status)}"></span>
        <div class="f-body"><div class="f-item">${escapeHtml(f.item)}</div>
        <div class="f-detail">${escapeHtml(f.detail)}</div></div></li>`;
    });
    html += '</ul>';
  }

  if (data.care_advice && data.care_advice.length) {
    html += '<div class="advice-title">世話のアドバイス</div><ul class="advice-list">';
    data.care_advice.forEach(a => { html += `<li>${escapeHtml(a)}</li>`; });
    html += '</ul>';
  }

  if (data.vet_recommended) {
    html += `<div class="vet-banner"><b>⚠ 動物病院への相談をおすすめします。</b><br>${escapeHtml(data.vet_reason || '')}</div>`;
  }

  html += `<div class="disclaimer">${escapeHtml(data.disclaimer || 'この結果は写真からの参考情報であり、獣医による診断の代わりにはなりません。気になる症状が続く場合は爬虫類を診療できる動物病院にご相談ください。')}</div>`;

  resultCard.style.display = 'block';
  resultCard.innerHTML = html;
}

// --- 履歴 ---
function saveHistory(data) {
  const history = JSON.parse(localStorage.getItem(STORAGE_HISTORY_KEY) || '[]');
  const cls = statusClass(data.vet_recommended, data.findings);
  history.unshift({
    date: new Date().toISOString(),
    thumb: currentThumb,
    summary: data.overall_impression || '',
    status: cls
  });
  while (history.length > MAX_HISTORY) history.pop();
  localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem(STORAGE_HISTORY_KEY) || '[]');
  if (!history.length) {
    historyList.innerHTML = '<div class="empty-history">まだ記録がありません</div>';
    return;
  }
  historyList.innerHTML = history.map(h => {
    const d = new Date(h.date);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const badgeLabel = h.status === 'alert' ? '要受診相談' : (h.status === 'warn' ? '経過観察' : '良好');
    return `<div class="history-item">
      <img src="${h.thumb}">
      <div class="history-meta">
        <div class="history-date">${dateStr}</div>
        <div class="history-summary">${escapeHtml(h.summary)}</div>
      </div>
      <span class="history-badge ${h.status}">${badgeLabel}</span>
    </div>`;
  }).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

renderHistory();

// --- PWA登録 ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
